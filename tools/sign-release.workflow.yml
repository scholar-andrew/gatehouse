# Signs each published program file, and each pack's pack.toml (R40), with the release key kept in this repository's
# secrets (RELEASE_SIGNING_KEY), and adds the signatures to the "signatures" release as <sha256 of the file>.sig.
#
# A pack.toml holds the fingerprint of the pack's list of files, and that list holds every file's, so its signature
# covers the whole pack: any machine can hand a pack on, and the device taking it can tell whether it is the published one.
#
# tools/setup_signing_key.ps1 puts this file at .github/workflows/sign-release.yml, makes the key and stores it.
# A missing signature doesn't stop anything (clients take an unsigned update as before); a signature that doesn't fit
# does. To check one by hand:
#   openssl pkeyutl -verify -pubin -inkey source/release-key.pub.pem -rawin -in oj-host.jar -sigfile <sha256>.sig
name: Sign the published program
on:
  push:
    branches: [main]
    paths: ['dist/gatekeeper/gatekeeper.json', 'dist/*/pack.toml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: sign-release
jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sign the program file and the packs
        env:
          KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${KEY:-}" ]; then echo "No signing key is set up (tools/setup_signing_key.ps1): nothing was signed."; exit 0; fi
          file=dist/gatekeeper/oj-host.jar
          sha=$(sha256sum "$file" | cut -d' ' -f1)
          want=$(python3 -c "import json; print(json.load(open('dist/gatekeeper/gatekeeper.json', encoding='utf-8-sig'))['sha256'].lower())")
          if [ "$sha" != "$want" ]; then echo "The program file and its published checksum differ: not signed."; exit 1; fi
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/key.pem"
          gh release view signatures >/dev/null 2>&1 || gh release create signatures --latest=false --title "Signatures" \
            --notes "Signatures of each published program file (dist/gatekeeper/oj-host.jar) and each pack's pack.toml, named by the file's SHA-256. The public key is source/release-key.pub.pem. Not a download for installing anything."
          # One file: signed, checked against the public key in the repository (or not published), and uploaded.
          sign() {
            local f="$1" s
            s=$(sha256sum "$f" | cut -d' ' -f1)
            openssl pkeyutl -sign -inkey "$RUNNER_TEMP/key.pem" -rawin -in "$f" -out "$s.sig"
            openssl pkeyutl -verify -pubin -inkey source/release-key.pub.pem -rawin -in "$f" -sigfile "$s.sig"
            gh release upload signatures "$s.sig" --clobber
            echo "Signed $f: $s"
          }
          sign "$file"
          for p in dist/*/pack.toml; do [ -f "$p" ] && sign "$p"; done
          rm -f "$RUNNER_TEMP/key.pem"
