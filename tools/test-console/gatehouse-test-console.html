<title>Gatehouse Test Console</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: the launcher's own shape. A top bar of sections (the every-update pass, then one per update), a strip of
   filters, a column of cards (one check each), and a bottom strip that counts. One dark look, the program's colours. */
:root {
  color-scheme: dark;
  --bg0: #0D141D; --bg1: #1B2838; --deep: #141D29; --card: #22344A; --card-hi: #2B4563; --raised: #2A475E; --line: #2F4860;
  --text: #E6EEF5; --dim: #8F98A0; --acc: #66C0F4; --good: #8BD46E; --warn: #E9B949; --bad: #FF7B72; --on: #3FB950; --off: #445262; --cant: #9AA7C7;
  --ui: "Segoe UI", system-ui, -apple-system, "Noto Sans", Arial, sans-serif;
}
body { min-height: 100vh; background-color: var(--bg0); background-image: linear-gradient(180deg, var(--bg1), var(--bg0) 900px); background-repeat: no-repeat; color: var(--text); font-family: var(--ui); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--deep); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1060px; margin-inline: auto; }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--deep); border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; gap: 18px; padding-block: 10px; flex-wrap: wrap; }
.brand { font-weight: 800; letter-spacing: .22em; font-size: 14px; white-space: nowrap; }
.brand small { display: block; font-weight: 600; letter-spacing: .12em; font-size: 10.5px; color: var(--dim); }
.tabs { display: flex; gap: 2px; flex-wrap: wrap; min-width: 0; }
.tab { background: none; border: 0; color: var(--dim); font: 700 13px var(--ui); letter-spacing: .14em; padding: 8px 12px 9px; cursor: pointer; border-bottom: 3px solid transparent; text-transform: uppercase; }
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { color: #fff; border-bottom-color: var(--acc); }
.tab .n { display: inline-block; margin-left: 6px; font-size: 11px; letter-spacing: 0; color: var(--bg0); background: var(--warn); border-radius: 9px; padding: 0 6px; font-variant-numeric: tabular-nums; }
.tab .n[data-zero] { background: var(--off); color: var(--text); }
.filters { display: flex; gap: 8px 18px; flex-wrap: wrap; align-items: center; padding-block: 12px 4px; }
.group { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.group > span { color: var(--dim); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; margin-right: 2px; }
.chip { background: var(--deep); border: 1px solid var(--line); color: var(--dim); font: 600 13px var(--ui); border-radius: 15px; padding: 4px 12px; cursor: pointer; }
.chip:hover { color: var(--text); border-color: var(--raised); }
.chip[aria-pressed="true"], .chip[aria-selected="true"] { background: var(--raised); color: #fff; border-color: var(--acc); }
.headrow { display: flex; gap: 10px 16px; align-items: flex-end; flex-wrap: wrap; margin: 14px 0 12px; }
.headrow > div { flex: 1 1 320px; min-width: 0; }
h2 { font-size: 22px; font-weight: 700; margin: 0 0 2px; text-wrap: balance; }
.sub { color: var(--dim); margin: 0; max-width: 70ch; }
.btn { background: var(--raised); border: 1px solid var(--line); color: #fff; font: 700 14px var(--ui); padding: 9px 14px; border-radius: 8px; cursor: pointer; }
.btn:hover { background: #3D6C8E; }
.btn.quiet { background: var(--deep); color: var(--dim); font-weight: 600; }
.btn.quiet:hover { color: var(--text); background: var(--deep); border-color: var(--raised); }
.list { display: block; padding-bottom: 120px; }
.list > * { margin-bottom: 10px; }
.card { background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--off); border-radius: 12px; padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: flex-start; }
.card > .main { flex: 1 1 300px; min-width: 0; }
.card > .side { flex: 0 0 auto; margin-left: auto; }
.card[data-state="works"] { border-left-color: var(--good); }
.card[data-state="broken"] { border-left-color: var(--bad); }
.card[data-state="unintended"] { border-left-color: var(--warn); }
.card[data-state="tested"] { border-left-color: var(--acc); }
.card[data-state="cant"] { border-left-color: var(--cant); }
.card:focus-within { background: var(--card-hi); }
.card > .full { flex: 0 0 100%; min-width: 0; box-sizing: border-box; }
.title { font-size: 16.5px; font-weight: 700; margin: 0; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 6px; }
.tag { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--acc); background: var(--deep); border-radius: 4px; padding: 2px 7px; }
.tag.ver { color: var(--dim); }
.tag.every { color: var(--good); }
.tag.own { color: var(--warn); }
.tag.regress { color: var(--bg0); background: var(--bad); }
.steps { margin: 0; color: #C9D6E2; max-width: 68ch; white-space: pre-line; }
.first { margin: 6px 0 0; font-size: 13.5px; color: var(--warn); }
.first button { background: none; border: 0; color: var(--acc); font: inherit; text-decoration: underline; cursor: pointer; padding: 0; }
.reply { background: #1C3550; border: 1px solid var(--acc); border-radius: 8px; padding: 8px 11px; font-size: 14px; }
.reply b { color: var(--acc); letter-spacing: .08em; font-size: 12px; text-transform: uppercase; margin-right: 6px; }
.past { font-size: 13px; color: var(--dim); }
.side { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.switch { display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 700; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); background: none; border: 0; padding: 4px; border-radius: 16px; font-family: var(--ui); }
.switch i { width: 46px; height: 26px; border-radius: 13px; background: var(--off); position: relative; transition: background .15s; flex: none; }
.switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: left .15s; }
.switch[aria-checked="true"] { color: #fff; }
.switch[aria-checked="true"] i { background: var(--on); }
.switch[aria-checked="true"] i::after { left: 23px; }
.devs { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
.devs > span { color: var(--dim); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; margin-right: 2px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; background: var(--off); }
.dot[data-s="works"] { background: var(--good); } .dot[data-s="broken"] { background: var(--bad); } .dot[data-s="unintended"] { background: var(--warn); } .dot[data-s="tested"] { background: var(--acc); } .dot[data-s="cant"] { background: var(--cant); }
.outcome { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.seg { flex: 1 1 140px; background: var(--deep); border: 1px solid var(--line); color: var(--dim); font: 700 14px var(--ui); padding: 9px 10px; border-radius: 8px; cursor: pointer; }
.seg:hover { color: var(--text); border-color: var(--raised); }
.seg[aria-checked="true"][data-v="works"] { background: #21452A; border-color: var(--good); color: var(--good); }
.seg[aria-checked="true"][data-v="broken"] { background: #4A2424; border-color: var(--bad); color: var(--bad); }
.seg[aria-checked="true"][data-v="unintended"] { background: #473A17; border-color: var(--warn); color: var(--warn); }
.seg[aria-checked="true"][data-v="cant"] { background: #2C3350; border-color: var(--cant); color: var(--cant); }
.note { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
.note label, .form label { font-size: 13px; color: var(--acc); font-weight: 600; }
.note label.plain { color: var(--dim); }
textarea, input[type="text"], select { background: var(--deep); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; font: 14.5px/1.4 var(--ui); width: 100%; box-sizing: border-box; }
textarea { min-height: 44px; resize: vertical; }
textarea:focus, input[type="text"]:focus, select:focus { border-color: var(--acc); outline: none; }
.shots { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 2px; }
.paste { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.paste input { flex: 1 1 220px; border-style: dashed; border-color: var(--acc); }
.shot { position: relative; }
.shot img { height: 72px; width: auto; max-width: 150px; border-radius: 6px; border: 1px solid var(--line); display: block; }
.shot button { position: absolute; top: -7px; right: -7px; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line); background: var(--deep); color: var(--text); font: 700 12px var(--ui); cursor: pointer; line-height: 1; }
.meta { font-size: 12px; color: var(--dim); min-height: 16px; }
.form { background: var(--card-hi); border: 1px solid var(--acc); border-radius: 12px; padding: 14px 16px; display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 8px 14px; }
.form > div { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.form .full { grid-column: 1 / -1; }
.form .row { flex-direction: row; gap: 8px; flex-wrap: wrap; }
.grp { display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: 0; border-bottom: 1px solid var(--line); color: var(--text); font: 700 13px var(--ui); letter-spacing: .14em; text-transform: uppercase; padding: 14px 2px 8px; cursor: pointer; text-align: left; }
.grp:hover { color: #fff; }
.grp .n { font-size: 12px; letter-spacing: 0; border-radius: 9px; padding: 0 7px; background: var(--off); color: var(--text); font-variant-numeric: tabular-nums; }
.grp[data-g="todo"] .n { background: var(--warn); color: var(--bg0); }
.grp[data-g="bad"] .n { background: var(--bad); color: var(--bg0); }
.grp[data-g="good"] .n { background: var(--good); color: var(--bg0); }
.grp[data-g="cant"] .n { background: var(--cant); color: var(--bg0); }
.grp .fold { margin-left: auto; color: var(--dim); font-size: 12px; letter-spacing: .08em; }
.empty { border: 1px dashed var(--line); border-radius: 12px; padding: 26px 18px; color: var(--dim); text-align: center; }
footer { position: fixed; inset: auto 0 0; background: rgba(20, 29, 41, .96); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.strip { display: flex; gap: 6px 20px; flex-wrap: wrap; align-items: center; padding-block: 9px; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.strip b { font-weight: 700; }
.strip .say { margin-left: auto; color: var(--dim); }
button:focus-visible, textarea:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
@media (max-width: 620px) { .form { grid-template-columns: minmax(0, 1fr); } .card > .main { flex-basis: 100%; } .card > .side { margin-left: 0; align-items: flex-start; } .strip .say { margin-left: 0; width: 100%; } }
.oops { border: 1px solid var(--bad); color: var(--bad); border-radius: 8px; padding: 10px 12px; font-size: 13.5px; white-space: pre-wrap; }
@media (prefers-reduced-motion: reduce) { .switch i, .switch i::after { transition: none; } }
</style>

<header><div class="wrap bar">
  <div class="brand">GATEHOUSE<small>TEST CONSOLE</small></div>
  <div class="tabs" id="tabs" role="tablist" aria-label="Sections"></div>
</div></header>

<main class="wrap">
  <div class="filters">
    <div class="group" id="devices" aria-label="Device"><span>Device</span></div>
    <div class="group" id="shows" aria-label="Show"><span>Show</span></div>
  </div>
  <div class="headrow">
    <div><h2 id="head">Everything to test</h2><p class="sub" id="sub"></p></div>
    <button class="btn" type="button" id="report">Something else went wrong</button>
  </div>
  <div class="list" id="list">
    <form class="form" id="form" hidden>
      <div><label for="f-title">What went wrong, in a few words</label><input type="text" id="f-title" maxlength="140" placeholder="The Play button did nothing"></div>
      <div><label for="f-device">On which device</label><select id="f-device"></select></div>
      <div class="full"><label for="f-note">What happened, and what you expected</label><textarea id="f-note" rows="3" maxlength="4000"></textarea></div>
      <div class="full row"><button class="btn" type="submit">Add it</button><button class="btn quiet" type="button" id="f-cancel">Cancel</button></div>
    </form>
    <div class="empty" id="empty">Loading the checks…</div>
  </div>
</main>

<footer><div class="wrap strip" id="strip"></div></footer>

<script>
(function () {
  var OUT = [["works", "Works"], ["broken", "Doesn't work"], ["unintended", "Doesn't work as intended"], ["cant", "Can't test"]];
  var SAYS = { works: "Works", broken: "Doesn't work", unintended: "Doesn't work as intended", cant: "Couldn't test", tested: "Tested, no verdict", untested: "Not tested" };
  var DEVICES = ["PC", "Steam Deck", "Laptop", "Phone"];
  var items = {}, results = {}, cards = {}, sel = {}, db = null, assets = null, loaded = false, current = "";
  var view = { ver: "smoke", device: "all", show: "all" };
  try { var kept = JSON.parse(localStorage.getItem("gh-test-view") || "null"); if (kept && typeof kept === "object") { view.ver = kept.ver || "smoke"; view.device = kept.device || "all"; view.show = kept.show || "all"; } } catch (e) {}
  function keep() { try { localStorage.setItem("gh-test-view", JSON.stringify(view)); } catch (e) {} }
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function slug(s) { return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-"); }
  function verNum(v) { return String(v).split(".").map(function (n) { return ("0000" + (parseInt(n, 10) || 0)).slice(-4); }).join("."); }
  function live() { return Object.keys(items).map(function (k) { return items[k]; }).filter(function (i) { return !i.retired; }); }

  // A check that is tried with every update starts again, untested, with each version; the others keep one answer.
  // A check for "any device" keeps an answer for each device.
  function round(item) { return item.every ? (current || "now") : "once"; }
  function devicesOf(item) { return item.device === "Any device" || !item.device ? DEVICES : [item.device]; }
  function key(item, dev) { return item.id + "__" + round(item) + "__" + slug(dev); }
  function res(item, dev) { return results[key(item, dev)] || { tested: false, outcome: "", note: "", shots: [] }; }
  function one(r) { return !r.tested ? "untested" : r.outcome || "tested"; }
  function stateOf(item) {
    var s = devicesOf(item).map(function (d) { return one(res(item, d)); });
    if (s.indexOf("broken") >= 0) return "broken";
    if (s.indexOf("unintended") >= 0) return "unintended";
    if (s.every(function (x) { return x === "untested"; })) return "untested";
    if (s.indexOf("tested") >= 0) return "tested";
    return s.indexOf("works") >= 0 ? "works" : "cant";
  }
  function chosen(item) {
    var ds = devicesOf(item);
    if (ds.length === 1) return ds[0];
    if (view.device !== "all" && ds.indexOf(view.device) >= 0 && !sel[item.id + "|pinned"]) return view.device;
    return sel[item.id] && ds.indexOf(sel[item.id]) >= 0 ? sel[item.id] : ds[0];
  }
  /** What earlier versions' answers were, for a check tried with every update: [[version, [[device, state]]]] newest first. */
  function past(item) {
    if (!item.every) return [];
    var by = {};
    Object.keys(results).forEach(function (k) { var r = results[k]; if (r.item === item.id && r.round && r.round !== round(item) && r.round !== "once" && r.tested) (by[r.round] = by[r.round] || []).push([r.device || "", one(r)]); });
    return Object.keys(by).sort(function (a, b) { return verNum(b) > verNum(a) ? 1 : -1; }).map(function (v) { return [v, by[v]]; });
  }
  function regressed(item) {
    var p = past(item);
    if (!p.length) return "";
    var bad = devicesOf(item).some(function (d) { var now = one(res(item, d)); return (now === "broken" || now === "unintended") && p[0][1].some(function (x) { return x[0] === d && x[1] === "works"; }); });
    return bad ? p[0][0] : "";
  }

  // ---- where a card sits. A check waits under "To test" until it has a verdict, then moves to the group for that
  // verdict. A card that still wants words (a problem, or a check that asks something) stays where it is until you
  // go on to something else, so it doesn't jump away from under the text box.
  var GROUPS = [["todo", "To test"], ["bad", "Tested: doesn't work"], ["cant", "Tested: couldn't be tested"], ["good", "Tested: works"]];
  var folded = { good: true }, heads = {}, held = null, heldGroup = null;
  try { var kf = JSON.parse(localStorage.getItem("gh-test-fold") || "null"); if (kf && typeof kf === "object") folded = kf; } catch (e) {}
  function groupOf(item) {
    var st = stateOf(item), ds = devicesOf(item);
    if (view.device !== "all" && ds.length > 1 && ds.indexOf(view.device) >= 0) st = one(res(item, view.device));
    return st === "works" ? "good" : st === "broken" || st === "unintended" ? "bad" : st === "cant" ? "cant" : "todo";
  }
  function groupName(g) { for (var i = 0; i < GROUPS.length; i++) if (GROUPS[i][0] === g) return GROUPS[i][1]; return g; }
  function head(g) {
    if (heads[g]) return heads[g];
    var b = el("button", "grp"); b.type = "button"; b.dataset.g = g; b.id = "grp-" + g;
    b.appendChild(el("span", null, groupName(g))); b.appendChild(el("span", "n", "0")); b.appendChild(el("span", "fold", ""));
    b.addEventListener("click", function () { folded[g] = !folded[g]; try { localStorage.setItem("gh-test-fold", JSON.stringify(folded)); } catch (e) {} render(); });
    return heads[g] = b;
  }
  function letGo(ev) {
    if (!held || !cards[held]) { held = null; return; }
    if (ev && ev.target && cards[held].root.contains(ev.target)) return;
    held = null; heldGroup = null; render();
  }
  document.addEventListener("click", letGo);
  document.addEventListener("focusin", letGo);

  // ---- saving: one write at a time for each answer, and only when something changed
  var chain = {}, timers = {}, pending = {}, saidTimer = null;
  function say(text, bad) { var s = $("say"); if (!s) return; s.textContent = text; s.style.color = bad ? "var(--bad)" : ""; clearTimeout(saidTimer); if (!bad) saidTimer = setTimeout(function () { if ($("say")) $("say").textContent = "Saved as you go"; }, 2500); }
  function save(item, dev) {
    var k = key(item, dev);
    clearTimeout(timers[k]); delete timers[k];
    if (!db) { say("Not saved: sign in to claude.ai to keep your answers", true); return; }
    var r = res(item, dev), doc = { item: item.id, round: round(item), device: dev, tested: !!r.tested, outcome: r.tested ? (r.outcome || "") : "", note: r.note || "", shots: r.shots || [], at: new Date().toISOString(), title: item.title || "" };
    say("Saving…");
    pending[k] = (pending[k] || 0) + 1;
    chain[k] = (chain[k] || Promise.resolve()).then(function () { return db.doc("results/" + k).set(doc); }).then(function () { pending[k]--; say("Saved"); }, function (e) { pending[k]--; say("Not saved: " + ((e && e.message) || "the store didn't answer"), true); });
  }
  function change(item, dev, patch) {
    var before = held === item.id ? heldGroup : groupOf(item);
    var r = Object.assign({}, res(item, dev), patch);
    if (!r.tested) r.outcome = "";
    results[key(item, dev)] = r;
    var after = groupOf(item);
    if (after !== before) {
      // (works, and nothing more is asked: it goes straight away. Anything else waits for you to finish with the card.)
      if (after === "good" && !item.ask && !(r.note || "").length) { held = null; heldGroup = null; say("Moved to " + groupName(after)); }
      else { held = item.id; heldGroup = before; }
    } else if (held === item.id && after === heldGroup) { held = null; heldGroup = null; }
    render();
    save(item, dev);
  }

  // ---- one card for each check, made once and then kept in step
  function make(item) {
    var id = item.id, c = el("article", "card"), k = { root: c, item: item };
    c.id = "card-" + id;
    var left = el("div", "main");
    left.appendChild(el("h3", "title", item.title));
    k.tags = el("div", "tags"); left.appendChild(k.tags);
    left.appendChild(el("p", "steps", item.steps || ""));
    k.first = el("p", "first"); left.appendChild(k.first);
    var side = el("div", "side");
    k.sw = el("button", "switch"); k.sw.type = "button"; k.sw.setAttribute("role", "switch"); k.sw.id = "sw-" + id;
    k.swText = el("span", null, "Not tested"); k.sw.appendChild(k.swText); k.sw.appendChild(el("i"));
    k.sw.addEventListener("click", function () { var d = chosen(items[id]); change(items[id], d, { tested: !res(items[id], d).tested }); });
    side.appendChild(k.sw);
    k.reply = el("div", "reply full");
    k.devs = el("div", "devs full"); k.devs.setAttribute("role", "tablist"); k.devs.setAttribute("aria-label", "Device");
    k.out = el("div", "outcome full"); k.out.setAttribute("role", "radiogroup"); k.out.setAttribute("aria-label", "How it went");
    OUT.forEach(function (o) {
      var b = el("button", "seg", o[1]); b.type = "button"; b.dataset.v = o[0]; b.setAttribute("role", "radio"); b.id = "o-" + id + "-" + o[0];
      b.addEventListener("click", function () { var d = chosen(items[id]); change(items[id], d, { tested: true, outcome: res(items[id], d).outcome === o[0] ? "" : o[0] }); });
      k.out.appendChild(b);
    });
    k.note = el("div", "note full");
    k.lab = el("label", item.ask ? null : "plain", item.ask || "Anything worth knowing? (optional)");
    k.ta = el("textarea"); k.ta.id = "n-" + id; k.lab.htmlFor = k.ta.id; k.ta.rows = 2; k.ta.maxLength = 4000;
    k.ta.placeholder = item.ask ? "Type your answer here" : "What happened, and what you expected";
    k.ta.addEventListener("input", function () {
      var it = items[id], d = k.taFor || chosen(it), kk = key(it, d);
      results[kk] = Object.assign({}, res(it, d), { note: k.ta.value });
      clearTimeout(timers[kk]); timers[kk] = setTimeout(function () { save(it, d); }, 900);
    });
    c.addEventListener("paste", function (ev) {
      var f = pictureIn(ev);

  function chips(holder, list, k) {
